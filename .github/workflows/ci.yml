name: MirrorME CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/resolve-local-mirrorme-issues

permissions:
  contents: read

concurrency:
  group: mirrorme-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Initialize Python test report
        shell: bash
        run: |
          printf '%s\n' \
            'Python unit tests did not run because an earlier validation step failed.' \
            > python-test-output.txt

      - name: Type-check and build
        run: npm run check

      - name: Parse MirrorME PowerShell scripts
        shell: pwsh
        run: |
          $paths = @(
            "scripts/update-mkultra-v0.3.ps1",
            "scripts/start-mirrorme.ps1",
            "scripts/run-mirrorme.ps1",
            "scripts/update-mkultra-v0.4.ps1",
            "scripts/start-mkultra-v0.4.ps1",
            "scripts/run-mkultra-v0.4.ps1"
          )

          foreach ($path in $paths) {
            if (-not (Test-Path $path)) {
              throw "Required PowerShell script not found: $path"
            }

            $source = Get-Content $path -Raw
            [void][scriptblock]::Create($source)
          }

      - name: Validate v0.4 metadata and Python syntax
        shell: bash
        run: |
          set -euo pipefail

          python -m json.tool \
            knowledge/mkultra-v0.4-source-manifest.json \
            >/dev/null

          python -m py_compile \
            qviraex/thin_line/claims.py \
            qviraex/evolution/governed.py \
            qviraex/mkultra_v04.py \
            local_bridge/mirrorme_bridge.py \
            local_bridge/v04_service.py \
            local_bridge/mkultra_v04_bridge.py

      - name: Run Python unit tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover \
            -s tests \
            -p "test_*.py" \
            -v 2>&1 | tee python-test-output.txt

      - name: Run VIREAX consciousness observer tests
        shell: bash
        run: |
          python -m unittest qviraex.vireax.tests.test_consciousness_mode -v

      - name: Upload Python test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-test-output
          path: python-test-output.txt
          if-no-files-found: error
          retention-days: 14
